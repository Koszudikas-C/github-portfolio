<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070b13" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#brandGrad)" stroke-width="2.5" />

  <!-- Subtle glow line -->
  <path d="M12 18 C 24 14, 40 14, 52 18" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" stroke-linecap="round" />

  <!-- Code brackets & slash symbol -->
  <g filter="url(#glow)">
    <!-- Left bracket < -->
    <path d="M22 23 L14 32 L22 41" stroke="url(#brandGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Slash / -->
    <path d="M36 21 L28 43" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    
    <!-- Right bracket > -->
    <path d="M42 23 L50 32 L42 41" stroke="url(#brandGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Status / Accent dot -->
  <circle cx="50" cy="14" r="3" fill="#22c55e" stroke="#070b13" stroke-width="1.5" />
</svg>